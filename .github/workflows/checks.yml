name: Python checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -r requirements.lock
      - run: python -m pip install --no-deps --no-build-isolation -e .
      - run: python -m pytest --junitxml=artifacts/pytest.xml
      - run: python -m compileall -q emporio scripts
      - run: python scripts/verify_frontend.py
      - run: python scripts/verify_wheel.py
      - run: python scripts/build_pages.py
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: checks-${{ matrix.os }}-${{ matrix.python }}
          path: artifacts/
          retention-days: 14
  interface:
    name: Interface contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.22.2'
      - run: npm ci --ignore-scripts --no-audit --no-fund
        working-directory: tests/ui
      - run: node --test tests/ui/interface.test.mjs tests/ui/sound-lab.test.mjs tests/sound-dsp.test.mjs tests/ui/browser-runtime.test.mjs
        env:
          KONAET_QR_EVIDENCE: artifacts/browser-qr
      - run: node --test tests/gateway.test.mjs
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.lock
      - run: python scripts/verify_browser_export.py
  gateware:
    name: RTL / Python agreement
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - run: sudo apt-get update -qq && sudo apt-get install -y iverilog yosys
      - run: python scripts/verify_gateware.py
      - run: python scripts/verify_audio_gateware.py --synthesis
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: gateware-validation
          path: |
            artifacts/gateware-validation.json
            artifacts/audio-validation.json
            artifacts/audio-synthesis.log
          retention-days: 7
