<svg xmlns="http://www.w3.org/2000/svg" width="1050" height="310" viewBox="0 0 1050 310" role="img" aria-labelledby="title desc"><title id="title">KONAET credit-gate design map</title><desc id="desc">Request and refill inputs feed a bounded credit counter and admission decision. Registers emit admitted, rejected and remaining credits. Logical design, not a fabricated circuit board.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 8 4 0 8" fill="#658660"/></marker></defs><rect width="1050" height="310" rx="20" fill="#edf5e9"/><g stroke="#d2dfc9" stroke-width="1"><path d="M35 70H1015M35 245H1015"/><path d="M35 100V230M1015 100V230"/></g><g font-family="Arial,sans-serif"><text x="36" y="41" font-size="11" letter-spacing="2" fill="#6f8868">KONAET / DIGITAL DESIGN MAP</text><text x="1014" y="41" font-size="10" text-anchor="end" fill="#7a8e71">PYTHON REFERENCE × SYSTEMVERILOG</text><g fill="#fcfdf8" stroke="#b8cdae"><rect x="36" y="102" width="170" height="111" rx="15"/><rect x="260" y="102" width="240" height="111" rx="15"/><rect x="555" y="102" width="216" height="111" rx="15"/><rect x="825" y="102" width="190" height="111" rx="15"/></g><g fill="#315d3b" font-size="16"><text x="54" y="131">01 / Inputs</text><text x="279" y="131">02 / Credit budget</text><text x="573" y="131">03 / Decision</text><text x="843" y="131">04 / Registers</text></g><g fill="#708568" font-size="12"><text x="54" y="158">request_valid</text><text x="54" y="179">refill · reset · clock</text><text x="279" y="158">min(capacity, credits + refill)</text><text x="279" y="180">Reset restores the capacity</text><text x="573" y="158">Request + credit → admit</text><text x="573" y="180">No credit → reject</text><text x="843" y="158">admitted · rejected</text><text x="843" y="180">credits remaining</text></g><g fill="none" stroke="#658660" stroke-width="2" marker-end="url(#arrow)"><path d="M206 158H249"/><path d="M500 158H544"/><path d="M771 158H814"/><path d="M920 214V231H380V215"/></g><text x="36" y="278" font-size="11" fill="#7b8e72">LOGICAL CYCLES / NO PHYSICAL BOARD OR NETWORK OFFLOAD</text><text x="1014" y="278" font-size="11" text-anchor="end" fill="#557449">Ports and state defined in ingress_guard.sv</text></g></svg>
