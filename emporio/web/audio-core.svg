<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" role="img" aria-labelledby="title desc"><title id="title">KONAET H-01 digital audio architecture</title><desc id="desc">I2S capture and PCM level meters; three phase accumulators and a mixer connected to I2S output. A separate browser and model host provide control. Digital core is simulated; the board is proposed.</desc><rect width="600" height="450" rx="24" fill="#e5ebdc"/><g fill="none" stroke="#b7c6aa" stroke-width="1"><path d="M30 90H570M30 175H570M30 260H570M30 345H570M100 55V400M230 55V400M360 55V400M490 55V400"/></g><g font-family="Arial, sans-serif"><text x="30" y="35" font-size="10" letter-spacing="2" fill="#38583f">KONAET / AUDIO CORE / H-01</text><rect x="170" y="100" width="250" height="235" rx="18" fill="#1d4438"/><g fill="none" stroke="#c5e99a" stroke-width="2"><path d="M80 144H195M395 144H515M80 293H195M395 293H515M220 186V241M290 186V241M360 186V241M245 264H360"/><circle cx="80" cy="144" r="4"/><circle cx="515" cy="144" r="4"/><circle cx="80" cy="293" r="4"/><circle cx="515" cy="293" r="4"/></g><g fill="#f4fae8" font-size="11"><text x="194" y="128">PCM16 / CAPTURE</text><text x="194" y="161">I²S RX → LEVEL / ENERGY</text><text x="194" y="205">PHASE × 3 / TRIANGLE</text><text x="194" y="227">32-BIT ACCUMULATORS</text><text x="194" y="288">MIX / LEVEL / I²S TX</text><text x="194" y="313" font-size="9" fill="#c7dfa8">DIGITAL RESET + MUTE</text></g><g fill="#244837" font-size="10"><text x="30" y="127">ADC INPUT</text><text x="440" y="127">HOST METRICS</text><text x="30" y="276">CHORD CONTROL</text><text x="445" y="276">DAC OUTPUT</text><text x="30" y="375">48 kHz PCM · 32-bit slots · 12.288 MHz reference clock</text><text x="30" y="399" font-size="9">RTL + REFERENCE TESTS / BOARD AND ANALOG PATH NOT TESTED</text></g></g></svg>
